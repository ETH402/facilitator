name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eth402
          POSTGRES_USER: eth402
          POSTGRES_PASSWORD: eth402_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eth402 -d eth402"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.5"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Migration up and down
        env:
          ETH402_ENV: test
          ETH402_DATABASE_URL: postgres://eth402:eth402_dev_only@localhost:5432/eth402?sslmode=disable
          ETH402_ETHEREUM_RPC_URL: http://localhost:8545
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down
          go run ./cmd/migrate up
      - name: Database integration tests
        env:
          ETH402_TEST_DATABASE_URL: postgres://eth402:eth402_dev_only@localhost:5432/eth402?sslmode=disable
        # Every internal package, not an explicit list: the list has already
        # drifted twice as packages gained integration-tagged files, and a file
        # CI never compiles under the tag is a file that can break unnoticed
        # (internal/signer's KMS test skips without a key, but it must still
        # build). Packages without integration tests simply re-run their normal
        # tests, which is cheap.
        #
        # -p 1 because these packages share one database and coordinate through a
        # Postgres advisory lock, so they must not run concurrently.
        run: go test -tags=integration -p 1 ./internal/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.5"
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.12.2

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.5"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: false
          tags: eth402/facilitator:ci
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          target: policysigner
          push: false
          tags: eth402/policysigner:ci
