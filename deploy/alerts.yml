# Prometheus alerting rules for the settlement signer.
#
# Load alongside deploy/prometheus.yml:
#   rule_files: [ alerts.yml ]
#
# ADR-0004 decision 8 makes the bounded hot balance the final loss bound if the
# policy-signing boundary or its KMS authority is compromised. The boundary
# structurally restricts facilitator requests to canonical-USDC settlement, but
# its key can still spend gas. These rules make the balance a monitored control
# rather than a convention.
#
# Thresholds are examples. Set them from your own figures: the worst case per
# merchant per window is ETH402_MERCHANT_SETTLEMENT_QUOTA x ETH402_MAX_GAS_LIMIT x
# ETH402_MAX_FEE_PER_GAS_WEI.
groups:
  - name: eth402-signer
    rules:
      - alert: SignerBalanceLow
        # 0.01 ETH. Set this above the gas cost of the settlements you expect to
        # broadcast before the next top-up, or settlement stalls mid-flight and
        # leaves nonce gaps behind it.
        expr: eth402_signer_balance_wei < 1e16
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Settlement signer balance is low"
          description: >-
            Broadcasts will start failing once gas is unaffordable, stranding
            committed intents and leaving nonce gaps that block later settlements.

      - alert: SignerBalanceDrainingFast
        # deriv() over the gauge rather than an in-process counter: it is correct
        # across restarts, which is exactly when a compromise would be noticed.
        # Negative because the balance is falling; -1e15 wei/s is ~0.001 ETH/s.
        expr: deriv(eth402_signer_balance_wei[15m]) < -1e15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Settlement signer balance is falling unusually fast"
          description: >-
            Faster than legitimate settlement volume explains. A compromised
            facilitator cannot ask the policy boundary to sign arbitrary
            transactions, but a compromised boundary or KMS authority can spend
            gas until the bounded balance is gone.

      - alert: SignerBalanceStale
        # A failing balance read leaves the last figure in place, which looks
        # healthy. Staleness is the signal, so it is alerted separately from
        # depletion.
        expr: time() - eth402_signer_balance_updated_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Settlement signer balance has not been read recently"
          description: >-
            The published balance is stale, so depletion and drain alerts are
            both blind. Check RPC reachability.

      - alert: SignerBalanceUnreadable
        expr: increase(eth402_signer_balance_read_errors_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Signer balance reads are failing"

  - name: eth402-merchant-security
    rules:
      - alert: MerchantPendingRecipientChanged
        expr: increase(eth402_recipient_pending_changes_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A pending merchant changed its recipient"
          description: >-
            This may be legitimate onboarding, but it is also the mailbox-takeover
            signal documented in the threat model. Correlate the timestamp with
            sanitized recipient.pending_changed audit events; never put a wallet,
            email, or merchant identifier into metric labels.

  - name: eth402-liveness
    rules:
      - alert: SettlementWorkerStalled
        # Health is derived from the last completed tick rather than a flag the
        # worker sets, because a wedged worker never gets around to clearing its own
        # flag. Threshold should be several ETH402_WORKER_INTERVAL periods.
        expr: time() - eth402_worker_last_tick_timestamp_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Settlement worker {{ $labels.worker }} has stopped ticking"
          description: >-
            Committed settlement intents stop progressing. The broadcast worker
            retries intents, the confirmation worker finalizes them, and the recovery
            worker resolves ambiguous broadcasts and nonce gaps — a stall in any of
            them leaves payments in a non-terminal state indefinitely.

      - alert: SettlementWorkersAbsent
        # Absent rather than stale: settlement is enabled but no worker has ever
        # ticked, so the series does not exist at all.
        expr: absent(eth402_worker_last_tick_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No settlement worker has reported a tick"
          description: >-
            Expected when the signer is disabled. Otherwise the workers never
            started.

      - alert: EthereumRPCErrorRateHigh
        expr: >-
          rate(eth402_rpc_errors_total[10m])
            / clamp_min(rate(eth402_rpc_requests_total[10m]), 0.001) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ethereum RPC failure rate above 25%"
          description: >-
            Each provider attempt and retry is counted independently. Verification
            and settlement require every configured provider; sustained failures
            stall broadcasts and confirmations rather than degrading to one source.

      - alert: EthereumRPCProviderDisagreement
        expr: increase(eth402_rpc_provider_disagreements_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Ethereum RPC providers disagree on payment-critical state"
          description: >-
            ETH402 failed the read closed. Investigate provider integrity, chain
            selection, and synchronization before resuming settlement; do not remove
            one provider merely to make the alert clear.

      - alert: RetentionWorkerStalled
        # Default retention interval is one hour. Tune this threshold when changing
        # ETH402_RETENTION_INTERVAL.
        expr: time() - eth402_retention_last_tick_timestamp_seconds > 7200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Privacy retention worker has stopped"
          description: >-
            Terminal authorization data and expired onboarding credentials are
            no longer being removed. Check process logs and database health.

      - alert: RetentionWorkerAbsent
        expr: absent(eth402_retention_last_tick_timestamp_seconds)
        for: 75m
        labels:
          severity: warning
        annotations:
          summary: "Privacy retention worker has never reported a pass"

      - alert: RetentionPassFailing
        expr: increase(eth402_retention_errors_total[2h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Privacy retention pass failed"

      - alert: EmailDeliveryWorkerStalled
        expr: >-
          eth402_email_delivery_last_tick_timestamp_seconds > 0
            and time() - eth402_email_delivery_last_tick_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Email delivery worker has stopped observing its outbox"
          description: >-
            Registration and merchant-login messages may remain queued. Check
            database connectivity, worker logs, and process health.

      - alert: EmailDeliveryWorkerAbsent
        expr: eth402_email_delivery_last_tick_timestamp_seconds == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Email delivery worker has never completed an observation"

      - alert: EmailDeliveryBacklogOld
        expr: >-
          eth402_email_outbox_pending > 0
            and eth402_email_outbox_oldest_pending_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Email delivery backlog is not draining"
          description: >-
            The oldest pending registration or login message is over five minutes
            old. Inspect SMTP reachability and recent sanitized delivery failures.

      - alert: EmailDeliveryFailures
        expr: increase(eth402_email_delivery_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Email delivery failed"
          description: >-
            Includes transient SMTP failures and permanently abandoned payloads
            that failed authenticated decryption. Corruption logs contain only a
            delivery ID and request ID; inspect them without exporting ciphertext.
