name: eth402-production

services:
  migrate:
    image: ${ETH402_APP_IMAGE:?set ETH402_APP_IMAGE to an immutable repository@sha256 digest}
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    env_file:
      - ${ETH402_MIGRATION_ENV_FILE:?set ETH402_MIGRATION_ENV_FILE to the host migration environment file}
    profiles: ["migration"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: ${ETH402_APP_IMAGE:?set ETH402_APP_IMAGE to an immutable repository@sha256 digest}
    env_file:
      - ${ETH402_APP_ENV_FILE:?set ETH402_APP_ENV_FILE to the host application environment file}
    restart: unless-stopped
    stop_grace_period: 60s
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/usr/local/bin/eth402", "-health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend
      - egress

  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    networks:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus:v3.4.1@sha256:9abc6cf6aea7710d163dbb28d8eeb7dc5baef01e38fa4cd146a406dd9f07f70d
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true
  # Only the application joins this ordinary bridge. It needs outbound TLS to
  # PostgreSQL, RPC, SMTP, and the policy signer; Caddy and Prometheus do not.
  egress:

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
